trigger:
- main  # or your actual branch name

pool:
  name: Default  # Your self-hosted agent pool
  demands:
    - maven
    - Agent.OS -equals Windows_NT

variables:
  mavenCacheDir: '$(USERPROFILE)\.m2\repository'

steps:
# ----------- Restore Maven Cache -----------
- task: Cache@2
  inputs:
    key: 'maven | "$(Agent.OS)" | **/pom.xml'
    restoreKeys: |
      maven | "$(Agent.OS)"
    path: $(mavenCacheDir)
    cacheHitVar: CACHE_RESTORED
  displayName: 'Restore Maven cache'

# ----------- Build Project -----------
- task: CmdLine@2
  displayName: 'Build with Maven'
  inputs:
    script: |
      mvn -B clean install

# ----------- Save Maven Cache -----------
- task: Cache@2
  inputs:
    key: 'maven | "$(Agent.OS)" | **/pom.xml'
    path: $(mavenCacheDir)
  condition: and(succeeded(), ne(variables['CACHE_RESTORED'], 'true'))
  displayName: 'Save Maven cache'
